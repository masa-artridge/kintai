<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f5fa8">
<title>勤怠管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --ink: #1d2330; --sub: #5d6778; --line: #d9dee6;
    --blue: #1f5fa8; --green: #1e8a4c; --orange: #d9822b; --red: #c0392b; --gray: #8a94a3;
    --greenbg: #e3f4ea; --orangebg: #fdf0e1; --graybg: #eceef2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; }
  body { user-select: none; -webkit-user-select: none; }
  input, select, textarea { user-select: text; -webkit-user-select: text; font: inherit; }
  button { font: inherit; cursor: pointer; border: none; }
  button:disabled { opacity: .35; cursor: default; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  /* ヘッダー */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px;
    background: var(--blue); color: #fff; gap: 12px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .clock { text-align: right; line-height: 1.1; }
  .clock .d { font-size: 16px; opacity: .9; }
  .clock .t { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .btn-admin { background: rgba(255,255,255,.18); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 16px; }

  /* ホーム：タイル */
  .home { flex: 1; padding: 24px; }
  .hint { color: var(--sub); font-size: 18px; margin: 0 0 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .tile { background: var(--card); border-radius: 16px; padding: 22px 16px; min-height: 130px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; border: 3px solid transparent; }
  .tile:active { transform: scale(.97); }
  .tile .nm { font-size: 28px; font-weight: 700; text-align: center; word-break: break-all; }
  .badge { font-size: 15px; padding: 4px 12px; border-radius: 99px; background: var(--graybg); color: var(--sub); }
  .tile.working { border-color: var(--green); background: var(--greenbg); }
  .tile.working .badge { background: var(--green); color: #fff; }
  .tile.onbreak { border-color: var(--orange); background: var(--orangebg); }
  .tile.onbreak .badge { background: var(--orange); color: #fff; }
  .tile.done .badge { background: var(--gray); color: #fff; }
  .tile .fw { font-size: 14px; color: #fff; background: var(--red); padding: 3px 10px; border-radius: 6px; font-weight: 700; }
  .warnbox { background: #fdecea; border: 2px solid var(--red); color: #7a1f16; border-radius: 14px; padding: 14px 20px;
    font-size: 19px; line-height: 1.6; margin-bottom: 20px; max-width: 760px; width: 100%; text-align: center; }
  .empty { background: var(--card); border-radius: 16px; padding: 40px; text-align: center; color: var(--sub); font-size: 20px; }

  /* 打刻画面 */
  .act { flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; }
  .act .who { font-size: 40px; font-weight: 700; margin: 8px 0 4px; }
  .act .st { font-size: 20px; color: var(--sub); margin-bottom: 24px; text-align: center; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 760px; }
  .abtn { border-radius: 18px; color: #fff; font-size: 30px; font-weight: 700; padding: 30px 10px; min-height: 120px;
    box-shadow: 0 3px 8px rgba(0,0,0,.15); line-height: 1.25; }
  .abtn small { display: block; font-size: 17px; font-weight: 500; opacity: .95; margin-top: 4px; }
  .abtn:active:not(:disabled) { transform: scale(.97); }
  .b-in { background: var(--blue); grid-column: span 2; }
  .b-brk { background: var(--orange); }
  .b-ret { background: #b86a1c; }
  .b-out { background: var(--green); }
  .b-out30 { background: #146b3a; }
  .back { margin-top: 28px; background: var(--card); color: var(--ink); font-size: 22px; padding: 18px 60px;
    border-radius: 14px; border: 2px solid var(--line); }

  /* トースト */
  .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(20,30,45,.93);
    color: #fff; padding: 30px 46px; border-radius: 20px; font-size: 30px; font-weight: 700; text-align: center;
    z-index: 100; box-shadow: 0 8px 30px rgba(0,0,0,.3); line-height: 1.4; max-width: 90vw; }
  .toast small { display: block; font-size: 20px; font-weight: 500; opacity: .85; }

  /* 暗証番号 */
  .pin { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px; }
  .pin h2 { font-size: 26px; margin: 10px 0; }
  .pin .dots { font-size: 40px; letter-spacing: 14px; height: 56px; margin-bottom: 10px; }
  .pin .err { color: var(--red); height: 26px; font-size: 18px; }
  .keys { display: grid; grid-template-columns: repeat(3, 96px); gap: 14px; margin-top: 10px; }
  .key { height: 82px; border-radius: 16px; background: var(--card); font-size: 32px; font-weight: 700;
    box-shadow: 0 2px 5px rgba(0,0,0,.1); color: var(--ink); }
  .key.sm { font-size: 18px; }

  /* 管理画面 */
  .admin { flex: 1; padding: 0 0 40px; }
  .tabs { display: flex; gap: 4px; padding: 12px 20px 0; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: none; padding: 14px 18px; font-size: 18px; color: var(--sub); border-bottom: 4px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
  .pane { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .box { background: var(--card); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .box h3 { margin: 0 0 12px; font-size: 19px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sbtn { background: var(--blue); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 17px; }
  .sbtn.ghost { background: var(--card); color: var(--blue); border: 2px solid var(--blue); }
  .sbtn.red { background: var(--red); }
  .sbtn.gray { background: var(--graybg); color: var(--ink); }
  .sbtn.mini { padding: 7px 12px; font-size: 15px; }
  .inp { padding: 10px 12px; font-size: 18px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .month { font-size: 22px; font-weight: 700; min-width: 150px; text-align: center; }
  .note { color: var(--sub); font-size: 15px; margin: 8px 0 0; line-height: 1.6; }
  .tblwrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: center; white-space: nowrap; }
  th { background: #f0f3f8; font-size: 14px; color: var(--sub); font-weight: 700; }
  th .k { display: block; color: var(--blue); font-size: 13px; }
  td.l, th.l { text-align: left; }
  tr.tot td { font-weight: 700; background: #f7f9fc; border-top: 2px solid var(--ink); }
  tr.click { cursor: pointer; }
  tr.click:active { background: #eef3fb; }
  .ot { color: var(--red); font-weight: 700; }
  .warn { color: var(--red); font-size: 13px; }
  .mark { color: var(--orange); font-size: 13px; }
  .sun { color: var(--red); } .sat { color: var(--blue); }
  .emp-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .emp-row .n { flex: 1; font-size: 20px; }

  /* モーダル */
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-start;
    justify-content: center; overflow-y: auto; padding: 30px 12px; }
  .modal { background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 560px; }
  .modal h3 { margin: 0 0 14px; font-size: 22px; }
  .fld { margin-bottom: 14px; }
  .fld label { display: block; font-size: 15px; color: var(--sub); margin-bottom: 4px; }
  .brk-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  .chk input { width: 26px; height: 26px; }
  .mbtns { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  @media (max-width: 600px) {
    .top { padding: 10px 14px; } .clock .t { font-size: 28px; } .top h1 { font-size: 18px; }
    .home, .act { padding: 16px; } .tiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .tile .nm { font-size: 22px; } .abtn { font-size: 22px; min-height: 96px; padding: 20px 6px; }
    .act .who { font-size: 30px; } .keys { grid-template-columns: repeat(3, 80px); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
'use strict';
/* =========================================================
   勤怠管理アプリ（タブレット用）
   データはこの端末のブラウザ内（localStorage）に保存します。
   ========================================================= */

const STORE_KEY = 'kintai_data_v1';
const DEFAULT_DATA = () => ({
  version: 1,
  employees: [],          // {id, name, retired}
  records: [],            // {id, empId, date:'YYYY-MM-DD', in:'HH:MM', out:'HH:MM'|null, breaks:[{s,e}], autoBreak:bool, edited:bool}
  settings: { pin: '0000', pinChanged: false, regularMin: 480, autoBreakMin: 30 },
  lastBackup: null
});

let DB = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return DEFAULT_DATA();
    const d = JSON.parse(raw);
    const base = DEFAULT_DATA();
    return { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
  } catch (e) { return DEFAULT_DATA(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch (e) { alert('保存できませんでした。端末の空き容量を確認してください。\n' + e.message); }
}
// 端末の容量不足時にデータが消されないよう、永続保存をお願いしておく
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- 小道具 ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hmStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const today = () => dateStr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); };
const toMin = hm => { if (!hm) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmt = min => (min == null ? '' : `${Math.floor(min / 60)}:${pad(min % 60)}`);
const fmtJ = min => { if (min == null) return ''; const h = Math.floor(min / 60), m = min % 60; return m ? `${h}時間${m}分` : `${h}時間`; };
const dec = min => (min == null ? '' : (min / 60).toFixed(2));
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const wday = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const empName = id => (DB.employees.find(e => e.id === id) || {}).name || '(削除済み)';
const activeEmps = () => DB.employees.filter(e => !e.retired);
// 出勤からこの時間を過ぎても退勤がない記録は「退勤の押し忘れ」とみなす
const FORGET_HOURS = 16;
const startTs = r => { const [y, m, d] = r.date.split('-').map(Number); const [h, mi] = r.in.split(':').map(Number); return new Date(y, m - 1, d, h, mi).getTime(); };

/* ---------- 計算 ---------- */
// 1件の記録から A〜D を出す（日をまたいだ退勤にも対応）
function calcRecord(r) {
  const inM = toMin(r.in);
  if (inM == null) return null;
  const norm = m => (m == null ? null : (m < inM ? m + 1440 : m));
  const outM = norm(toMin(r.out));
  let brk = 0;
  for (const b of r.breaks || []) {
    const s = norm(toMin(b.s));
    let e = norm(toMin(b.e));
    if (e == null) e = outM;           // 休憩戻りを押し忘れたら退勤時刻で締める
    if (s != null && e != null && e > s) brk += e - s;
  }
  // 「30分休憩 退勤」：休憩は30分。休憩ボタンで30分より長く記録していれば、その時間
  if (r.autoBreak) brk = Math.max(brk, DB.settings.autoBreakMin);
  if (outM == null) return { inM, outM: null, brk, total: null };
  const total = Math.max(0, outM - inM - brk);
  return { inM, outM, brk, total };
}

// ある従業員のある月の明細（E通常・F残業は1日単位で計算）
function monthRows(empId, ym) {
  const recs = DB.records.filter(r => r.empId === empId && r.date.startsWith(ym))
    .sort((a, b) => (a.date + a.in).localeCompare(b.date + b.in));
  const rows = [];
  const usedRegular = {};
  for (const r of recs) {
    const c = calcRecord(r);
    let reg = null, ot = null;
    if (c && c.total != null) {
      const left = Math.max(0, DB.settings.regularMin - (usedRegular[r.date] || 0));
      reg = Math.min(c.total, left);
      ot = c.total - reg;
      usedRegular[r.date] = (usedRegular[r.date] || 0) + reg;
    }
    rows.push({ r, c, reg, ot });
  }
  const sum = { days: new Set(rows.map(x => x.r.date)).size, brk: 0, total: 0, reg: 0, ot: 0, missing: 0 };
  for (const x of rows) {
    if (x.c && x.c.total != null) { sum.brk += x.c.brk; sum.total += x.c.total; sum.reg += x.reg; sum.ot += x.ot; }
    else sum.missing++;
  }
  return { rows, sum };
}

/* ---------- 打刻 ---------- */
const HOUR = 3600000;
// いま勤務中の記録（出勤から16時間以内で、退勤がまだのもの）
function openRecord(empId) {
  const now = Date.now();
  const list = DB.records.filter(r => r.empId === empId && !r.out && r.in &&
    now - startTs(r) < FORGET_HOURS * HOUR && startTs(r) - now < HOUR);
  return list.sort((a, b) => startTs(b) - startTs(a))[0] || null;
}
// 退勤の押し忘れ（出勤から16時間を過ぎても退勤がないもの。45日より前は出さない）
function forgotten(empId) {
  const now = Date.now();
  return DB.records.filter(r => r.empId === empId && !r.out && r.in &&
    now - startTs(r) >= FORGET_HOURS * HOUR && now - startTs(r) < 45 * 24 * HOUR)
    .sort((a, b) => startTs(a) - startTs(b));
}
function status(empId) {
  const forgot = forgotten(empId);
  const o = openRecord(empId);
  if (o) {
    const b = o.breaks[o.breaks.length - 1];
    if (b && !b.e) return { key: 'onbreak', label: '休憩中', rec: o, forgot };
    return { key: 'working', label: '勤務中', rec: o, forgot };
  }
  const done = DB.records.some(r => r.empId === empId && r.date === today() && r.out);
  return done ? { key: 'done', label: '退勤済み', forgot } : { key: 'off', label: '未出勤', forgot };
}
function punch(empId, kind) {
  const now = hmStr(new Date());
  const st = status(empId);
  const o = st.rec;
  let msg = '';
  if (kind === 'in') {
    if (o) return;
    DB.records.push({ id: uid(), empId, date: today(), in: now, out: null, breaks: [], autoBreak: false, edited: false });
    msg = '出勤しました';
  } else if (kind === 'brk') {
    if (st.key !== 'working') return;
    o.breaks.push({ s: now, e: null });
    msg = '休憩に入りました';
  } else if (kind === 'ret') {
    if (st.key !== 'onbreak') return;
    o.breaks[o.breaks.length - 1].e = now;
    msg = '休憩から戻りました';
  } else if (kind === 'out' || kind === 'out30') {
    if (!o) return;
    if (kind === 'out' && o.breaks.length) return;   // 休憩を記録した日は「休憩無 退勤」は押せない
    const b = o.breaks[o.breaks.length - 1];
    if (b && !b.e) b.e = now;
    o.out = now;
    o.autoBreak = kind === 'out30';
    msg = kind === 'out30' ? `退勤しました（${DB.settings.autoBreakMin}分休憩）` : '退勤しました（休憩なし）';
  }
  save();
  go('home');
  toast(`${esc(empName(empId))} さん<br>${msg}<small>${now}</small>`);
}

/* ---------- 画面切り替え ---------- */
let view = 'home', curEmp = null, adminTab = 'sum', adminMonth = today().slice(0, 7), detailEmp = null;
let pinBuf = '', idleTimer = null;

function go(v, opt = {}) {
  view = v;
  if (opt.emp !== undefined) curEmp = opt.emp;
  render();
  resetIdle();
}
function resetIdle() {
  clearTimeout(idleTimer);
  if (view === 'act') idleTimer = setTimeout(() => go('home'), 30000);          // 打刻画面は30秒で戻る
  else if (view === 'admin' || view === 'pin') idleTimer = setTimeout(() => { closeModal(); go('home'); }, 5 * 60000); // 管理は5分
}
document.addEventListener('pointerdown', resetIdle);

function render() {
  const app = $('#app');
  if (view === 'home') app.innerHTML = vHome();
  else if (view === 'act') app.innerHTML = vAct();
  else if (view === 'pin') app.innerHTML = vPin();
  else if (view === 'admin') app.innerHTML = vAdmin();
  tick();
}

function header(title, right = '') {
  return `<div class="top"><h1>${title}</h1><div class="row" style="gap:18px">${right}
    <div class="clock"><div class="d" id="cd"></div><div class="t" id="ct"></div></div></div></div>`;
}
function tick() {
  const n = new Date();
  const cd = $('#cd'), ct = $('#ct');
  if (cd) cd.textContent = `${n.getMonth() + 1}月${n.getDate()}日（${WD[n.getDay()]}）`;
  if (ct) ct.textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
}
setInterval(() => { tick(); if (view === 'home') refreshTiles(); }, 15000);
let lastDay = today();
function refreshTiles() { if (today() !== lastDay) { lastDay = today(); render(); } }

/* ---------- ホーム ---------- */
function vHome() {
  const emps = activeEmps();
  const tiles = emps.length ? `<div class="tiles">${emps.map(e => {
    const s = status(e.id);
    return `<button class="tile ${s.key}" data-a="emp" data-id="${e.id}"><div class="nm">${esc(e.name)}</div><div class="badge">${s.label}</div>${s.forgot.length ? '<div class="fw">退勤の押し忘れあり</div>' : ''}</button>`;
  }).join('')}</div>`
    : `<div class="empty">従業員がまだ登録されていません。<br>右上の「管理」から登録してください。</div>`;
  return header('勤怠管理', `<button class="btn-admin" data-a="admin">管理</button>`) +
    `<div class="home"><p class="hint">自分の名前をタッチしてください</p>${tiles}</div>`;
}

/* ---------- 打刻画面 ---------- */
function vAct() {
  const e = DB.employees.find(x => x.id === curEmp);
  if (!e) return vHome();
  const s = status(e.id);
  let info = s.label;
  if (s.rec) info += `（出勤 ${s.rec.in}${s.rec.date !== today() ? '・前日' : ''}）`;
  const tookBreak = !!(s.rec && s.rec.breaks.length);
  const can = { in: !s.rec, brk: s.key === 'working', ret: s.key === 'onbreak', out30: !!s.rec, out0: !!s.rec && !tookBreak };
  const ab = DB.settings.autoBreakMin;
  const forgotBox = s.forgot.length ? `<div class="warnbox">${s.forgot.map(r => {
      const [, mm, dd] = r.date.split('-').map(Number);
      return `${mm}月${dd}日（${WD[wday(r.date)]}）${r.in} 出勤`; }).join('、')} の<b>退勤が押されていません</b>。<br>
      管理者に退勤した時刻を伝えてください。きょうの出勤はこのまま押せます。</div>` : '';
  return header('勤怠管理') + `<div class="act">
    <div class="who">${esc(e.name)} さん</div><div class="st">いまの状態：${info}</div>${forgotBox}
    <div class="acts">
      <button class="abtn b-in" data-a="p" data-k="in" ${can.in ? '' : 'disabled'}>出勤</button>
      <button class="abtn b-brk" data-a="p" data-k="brk" ${can.brk ? '' : 'disabled'}>休憩</button>
      <button class="abtn b-ret" data-a="p" data-k="ret" ${can.ret ? '' : 'disabled'}>休憩戻り</button>
      <button class="abtn b-out30" data-a="p" data-k="out30" ${can.out30 ? '' : 'disabled'}>${ab}分休憩　退勤</button>

/* ---------- CSV ---------- */
function csvCell(v) { v = String(v ?? ''); return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
function buildCSV(ym) {
  const head = ['氏名', '日付', '曜日', 'A出勤', 'B退勤', 'C休憩時間', 'D総労働時間', 'E通常業務時間', 'F残業時間',
    'C休憩(時間)', 'D総労働(時間)', 'E通常業務(時間)', 'F残業(時間)', 'メモ'];
  const lines = [head];
  for (const e of empsInMonth(ym)) {
    const { rows, sum } = monthRows(e.id, ym);
    for (const { r, c, reg, ot } of rows) {
      const memo = [];
      if (!r.out) memo.push('退勤なし');
      if (r.autoBreak) memo.push(`${DB.settings.autoBreakMin}分休憩退勤`);
      if (r.edited) memo.push('修正あり');
      lines.push([e.name, r.date.replace(/-/g, '/'), WD[wday(r.date)], r.in, r.out || '',
        c ? fmt(c.brk) : '', c ? fmt(c.total) : '', fmt(reg), fmt(ot),
        c ? dec(c.brk) : '', c ? dec(c.total) : '', dec(reg), dec(ot), memo.join(' ')]);
    }
    lines.push([e.name, '月合計', '', '', '', fmt(sum.brk), fmt(sum.total), fmt(sum.reg), fmt(sum.ot),
      dec(sum.brk), dec(sum.total), dec(sum.reg), dec(sum.ot), `出勤日数${sum.days}日` + (sum.missing ? ` 退勤なし${sum.missing}件は合計外` : '')]);
    lines.push([]);
  }
  return '﻿' + lines.map(l => l.map(csvCell).join(',')).join('\r\n');
}

/* ---------- ファイルを送る／保存する ---------- */
async function sendFile(text, filename, mime, mode, title) {
  const blob = new Blob([text], { type: mime });
  if (mode === 'share') {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title, text: title }); return true; }
      catch (e) { if (e.name === 'AbortError') return false; }
    }
    alert('この画面からは直接送れませんでした。\nファイルを端末に保存するので、メールアプリで添付して送ってください。');
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function doBackup(mode) {
  const stamp = today() + '_' + hmStr(new Date()).replace(':', '');
  const text = JSON.stringify({ app: 'kintai', exportedAt: new Date().toISOString(), data: DB });
  // Androidの共有ではJSONが送れないことがあるので、送るときは .txt にする（中身は同じ）
  const ok = mode === 'share'
    ? await sendFile(text, `勤怠バックアップ_${stamp}.txt`, 'text/plain', 'share', '勤怠アプリのバックアップ')
    : await sendFile(text, `勤怠バックアップ_${stamp}.json`, 'application/json', 'dl');
  if (ok) { DB.lastBackup = Date.now(); save(); render(); }
}
function doRestore(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const d = obj.data || obj;
      if (!Array.isArray(d.employees) || !Array.isArray(d.records)) throw new Error('形式がちがいます');
      const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('ja-JP') : '不明';
      if (!confirm(`このバックアップで元に戻しますか？\n作成日時：${when}\n従業員 ${d.employees.length}人／記録 ${d.records.length}件\n\nいまの記録は置きかわります。`)) return;
      const base = DEFAULT_DATA();
      DB = { ...base, ...d, settings: { ...base.settings, ...(d.settings || {}) } };
      save();
      alert('元に戻しました。');
      render();
    } catch (e) { alert('このファイルは読みこめませんでした。\n' + e.message); }
  };
  fr.readAsText(file);
}

/* ---------- ボタン操作 ---------- */
let lastTap = 0;
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const a = t.dataset.a, k = t.dataset.k, id = t.dataset.id;
  switch (a) {
    case 'emp': go('act', { emp: id }); break;
    case 'home': pinBuf = ''; closeModal(); go('home'); break;
    case 'p': { const now = Date.now(); if (now - lastTap < 800) return; lastTap = now; punch(curEmp, k); break; }
    case 'admin': pinBuf = ''; go('pin'); break;
    case 'pk': pinKey(k); break;
    case 'tab': adminTab = k; detailEmp = null; render(); break;
    case 'mon': shiftMonth(+k); render(); break;
    case 'detail': detailEmp = id || null; render(); window.scrollTo(0, 0); break;
    case 'edit': openEdit(id); break;
    case 'close': closeModal(); break;
    case 'brkadd': readEditForm(); editing.breaks.push({ s: '', e: '' }); drawEdit(); break;
    case 'brkdel': readEditForm(); editing.breaks.splice(+k, 1); drawEdit(); break;
    case 'recsave': saveEdit(); break;
    case 'recdel':
      if (confirm('この記録を消しますか？（元に戻せません）')) {
        DB.records = DB.records.filter(r => r.id !== editing.id); save(); closeModal(); render();
      } break;
    case 'addemp': {
      const n = $('#newname').value.trim();
      if (!n) return alert('名前を入れてください');
      if (activeEmps().some(e => e.name === n)) return alert('同じ名前の人がもういます');
      DB.employees.push({ id: uid(), name: n, retired: false }); save(); render(); break;
    }
    case 'ren': {
      const e = DB.employees.find(x => x.id === id);
      const n = (prompt('新しい名前', e.name) || '').trim();
      if (n) { e.name = n; save(); render(); } break;
    }
    case 'delemp': {
      const e = DB.employees.find(x => x.id === id);
      if (status(id).rec) return alert(`${e.name} さんはいま勤務中です。退勤してから削除してください。`);
      if (confirm(`${e.name} さんを一覧から削除しますか？\n（これまでの勤怠記録は残ります）`)) { e.retired = true; save(); render(); } break;
    }
    case 'mv': {
      const list = activeEmps(); const i = list.findIndex(e => e.id === id); const j = i + (+k);
      if (j < 0 || j >= list.length) return;
      const ai = DB.employees.indexOf(list[i]), aj = DB.employees.indexOf(list[j]);
      [DB.employees[ai], DB.employees[aj]] = [DB.employees[aj], DB.employees[ai]];
      save(); render(); break;
    }
    case 'csv': {
      const [y, m] = adminMonth.split('-').map(Number);
      sendFile(buildCSV(adminMonth), `勤怠_${y}年${pad(m)}月.csv`, 'text/csv', k, `勤怠 ${y}年${m}月`); break;
    }
    case 'bk': doBackup(k); break;
    case 'setpin': {
      const p1 = $('#pin1').value, p2 = $('#pin2').value;
      if (!/^\d{4,8}$/.test(p1)) return alert('4〜8けたの数字にしてください');
      if (p1 !== p2) return alert('2回入れた番号がちがいます');
      DB.settings.pin = p1; DB.settings.pinChanged = true; save(); alert('暗証番号を変えました'); render(); break;
    }
    case 'setcalc': {
      const h = +$('#regh').value, mi = +$('#regm').value, ab = +$('#abm').value;
      if (!(h >= 0 && h <= 24 && mi >= 0 && mi < 60 && ab >= 0 && ab <= 180)) return alert('数字を確かめてください');
      DB.settings.regularMin = h * 60 + mi; DB.settings.autoBreakMin = ab; save(); alert('保存しました'); render(); break;
    }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'restore' && ev.target.files[0]) { doRestore(ev.target.files[0]); ev.target.value = ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'newname') $('[data-a="addemp"]').click();
});

/* ---------- オフラインで動くようにする ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
